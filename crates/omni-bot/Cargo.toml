[package]
name = "omni-bot"
description = "Multi-bot, multi-provider Telegram LLM bot (MTProto)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "omni"
path = "src/main.rs"

[dependencies]
omni-core = { workspace = true }
omni-markdown = { workspace = true }
omni-llm = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
rusqlite = { workspace = true }
clap = { workspace = true }
rand = { workspace = true }
jiff = { workspace = true }
regex = { workspace = true }
parking_lot = { workspace = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
mime_guess = { workspace = true }
grammers-client = { workspace = true }
grammers-mtsender = { workspace = true }
grammers-session = { workspace = true }
grammers-tl-types = { workspace = true }
imagesize = "0.15"

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
