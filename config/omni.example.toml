# omni configuration. Copy to config/omni.toml; the copy runs as is.
# What differs between deployments comes from the environment (.env, see
# .env.example): keys, tokens, the admins, the trigger marker. In string values
# `${VAR}` is replaced by the variable's value; `${VAR:-default}` gives the
# default when the variable is unset or empty.

[general]
data_dir = "data"              # database, blobs, logs (mounted as a volume in Docker)
timezone = "Asia/Shanghai"     # displayed times and daily stats boundaries
# What ends the model prefix (`c$hello`): OMNI_TRIGGER_MARKER, default "$"; e.g. "%" or "¥" or ">>"
# for a test bot in the same groups (no letters, digits, whitespace or ,+{}"=/-.:_\@`). Help texts
# and /models follow it.
trigger_marker = "${OMNI_TRIGGER_MARKER:-$}"
max_parallel_specs = 20        # max models in one `a,b,c$` trigger
max_file_mb = 50               # max Telegram file size forwarded to a model

[log]
level = "verbose"              # verbose (raw upstream payloads) | normal | quiet | any tracing filter
file = true                    # also write data/logs/omni.YYYY-MM-DD.utc.log (rolls over at 00:00 UTC)
keep_days = 0                  # daily log files to keep (0 = keep all)

[telegram]
# From https://my.telegram.org/apps
api_id = "${TELEGRAM_API_ID}"
api_hash = "${TELEGRAM_API_HASH}"

# Several bots can run in one process (separate rate limits, isolation). Every
# bot is independent, like a separate instance: its own allow list, bans, spend
# limits and runtime prefixes; in a group each bot answers the prefixes it has
# and ignores the others.
# `models`: the models a bot has, as patterns over canonical ids
# (`openrouter:author/model`, `<provider>:<model>` for the platforms' own APIs).
# A model no pattern matches does not exist for that bot (not listed, unknown as
# a prefix); neither do models of providers that are not configured.
[[bots]]
name = "main"                  # stable internal name (database key) — do not rename casually
token = "${TELEGRAM_BOT_TOKEN}"
models = [
    "openrouter:openai/*", "openrouter:anthropic/*", "openrouter:google/*", "openrouter:x-ai/*",
    "openrouter:deepseek/*", "openrouter:z-ai/*", "openrouter:moonshotai/*", "openrouter:qwen/*",
    "openai:*", "anthropic:*", "google:*", "xai:*", "deepseek:*", "zhipu:*", "moonshot:*", "alibaba:*", "ark:*",
]

# Example: a second, independent bot that has only Claude.
# [[bots]]
# name = "claude"
# token = "${TELEGRAM_BOT_TOKEN_CLAUDE}"
# models = ["openrouter:anthropic/*"]

# Telegram ids separated by commas, from the environment (empty: none); a TOML array
# such as [123456789] works here too.
[access]
admins = "${OMNI_ADMINS:-}"    # your Telegram user id(s), shown by /ping; their private chats are allowed once at first start
allowed_chats = "${OMNI_ALLOWED_CHATS:-}"  # chats (groups, or user ids for private chats) allowed for every bot
                               # once, at the first start after an id is added; removing one revokes nothing (/deny)
priority_users = "${OMNI_PRIORITY_USERS:-}"  # may request higher-priority (pricier) tiers: +tier=priority, fast
                               # modes. Nobody (admins included) gets them by default.

[providers.openrouter]
api_key = "${OPENROUTER_API_KEY:-}"   # empty: OpenRouter is off (like any platform without a key)
# The id of any model the bot has ([[bots]].models) may be typed directly as a prefix
# (`openai/gpt-6.1-sol$`), even one that also has a prefix: new models need no config
# change. false (the default): only the prefixes below and /alias reach OpenRouter.
allow_unlisted_models = true
# base_url = "https://openrouter.ai/api/v1"
# http_referer = "…"           # optional app attribution headers
# x_title = "…"
# connect_timeout_secs = 15
# idle_timeout_secs = 3600     # silence in a stream after which the attempt counts as stalled
# Every request is pinned to the model vendor's own endpoint without fallbacks, unless
# it names other official providers with `+p=` (allowed_providers below); OpenRouter's
# free routing is never used. See docs/openrouter-fidelity.md.
require_parameters = true      # never let OpenRouter silently drop parameters
echo_upstream_body = true      # log the exact upstream request (also in /info; OpenRouter does not echo Claude requests)
max_tokens_cap = 393216        # cap for the automatic max_tokens (0 = model maximum)
# Gemini long decode: models answering past the per-request output limit in
# several continuation hops. Their max_tokens is a total budget across hops;
# replying /continue to an answer that hit it extends it by the same amount.
long_decode = ["google/gemini-4*"]
long_decode_budget = 393216
# Salt of the stable per-user hash (sha256 of salt + Telegram user id, abuse attribution) that
# every platform gets: OpenRouter `user`; OpenAI, xAI, Moonshot, Ark images/video `safety_identifier`;
# Anthropic `metadata.user_id`; Gemini `labels.safety_identifier`; Zhipu `user_id`; xAI Imagine `user`.
# Empty: no user id is sent anywhere.
user_id_salt = "${OPENROUTER_USER_SALT:-}"
# Official providers users may switch to with `+p=<slug>` (per model author;
# base slugs, regions included). Built-in defaults: openai = openai, azure,
# amazon-bedrock; anthropic = anthropic, amazon-bedrock, google-vertex, azure,
# claude-on-aws; google = google-ai-studio, google-vertex; x-ai = xai,
# amazon-bedrock; open-weight vendors only their own endpoint. Override e.g.:
# [providers.openrouter.allowed_providers]
# google = ["google-ai-studio", "google-vertex"]
# Override the author -> first-party provider mapping:
# [providers.openrouter.first_party]
# google = "google-vertex"

# The platforms' own APIs. Each exists only when its key is set; its models are
# then `<provider>:<model id>` (`openai:gpt-6.1-sol`). The Chinese platforms are
# their domestic sites (as in the old bot). Keys every section accepts, with
# their defaults:
#   allow_unlisted_models = false # true: any `<provider>:<model id>$` works as a prefix
#   base_url = "…"               # the platform's official API
#   connect_timeout_secs = 15
#   idle_timeout_secs = 3600     # Ark: 1800
#   max_tokens_cap = 0           # cap for the automatic output budget (0 = the model's
#                                # maximum); Ark: 65536 (it reserves TPM quota by it)
#   cny_per_usd = 7.1            # cost estimates of platforms billing in CNY (DeepSeek,
#                                # Zhipu, Moonshot, Alibaba, Ark)
#   long_decode_budget = 393216  # Gemini 4 (google): total output across continuation hops
[providers.openai]             # https://api.openai.com/v1 (Responses API)
api_key = "${OPENAI_API_KEY:-}"
[providers.anthropic]          # https://api.anthropic.com/v1 (Messages API)
api_key = "${ANTHROPIC_API_KEY:-}"
[providers.google]             # Gemini API: https://generativelanguage.googleapis.com/v1beta
api_key = "${GEMINI_API_KEY:-}"
[providers.xai]                # https://api.x.ai/v1 (Responses API)
api_key = "${XAI_API_KEY:-}"
[providers.deepseek]           # https://api.deepseek.com
api_key = "${DEEPSEEK_API_KEY:-}"
[providers.zhipu]              # https://open.bigmodel.cn/api/paas/v4
api_key = "${ZHIPUAI_API_KEY:-}"
[providers.moonshot]           # https://api.moonshot.cn/v1
api_key = "${MOONSHOT_API_KEY:-}"
[providers.alibaba]            # Bailian / DashScope: https://dashscope.aliyuncs.com/compatible-mode/v1
api_key = "${DASHSCOPE_API_KEY:-}"
# Alibaba recommends the workspace domain (the one above gets no new features after 2026-09-30):
# base_url = "https://<WorkspaceId>.cn-beijing.maas.aliyuncs.com/compatible-mode/v1"
[providers.ark]                # Volcengine Ark (火山方舟, Doubao): https://ark.cn-beijing.volces.com/api/v3
api_key = "${ARK_API_KEY:-}"
allow_unlisted_models = false  # only the `db…` prefixes below; true: any `ark:<model id>$`

[render]
markdown = "clean"             # clean | raw (raw = the model's exact Markdown source)
first_flush_delay_secs = 1.0   # wait before a new reply's first message, to batch the first tokens
reasoning_open = false         # keep the reasoning fold open while the model thinks (every edit would
                               # re-open it for readers who closed it)
show_usage = "always"          # always | never | USD threshold such as "0.05"

[retry]
max_attempts = 4               # including the first; only retryable errors are retried
delays_secs = [2, 10, 30, 60]  # wait before retry 1, 2, 3, …; the last value repeats (longer waits the upstream asks for win)

# ------------------------------------------------------------------ prefixes
# `name$text` sends the text to the spec's model with the spec's options; the
# empty name is the prefix `$text`. /models lists them in this order. Every prefix
# uses the platform's own API (`<provider>:<model>`); the same prefix with an `o` in
# front uses OpenRouter (`oc$`, `o$` for the empty one). Where a provider has
# `allow_unlisted_models = true`, the id of any model the bot has works as a prefix
# too (`openai:gpt-6.1-sol$`, `openai/gpt-6.1-sol$` on OpenRouter). Administrators
# can add prefixes per bot with /alias. The list was chosen by the owner from the
# old bot's prefixes (2026-11-12); direct APIs by default since 2026-11-13.
