# omni configuration. Copy to config/omni.toml and adjust.
# Secrets come from the environment (see .env.example): `${VAR}` is replaced by
# the variable's value, `${VAR:-default}` provides a default.

[general]
data_dir = "data"              # database, blobs, logs (mounted as a volume in Docker)
timezone = "Asia/Shanghai"     # displayed times and daily stats boundaries
max_parallel_specs = 20        # max models in one `a,b,c$` trigger
max_file_mb = 50               # max Telegram file size forwarded to a model

[log]
level = "verbose"              # verbose (raw upstream payloads) | normal | quiet | any tracing filter
file = true                    # also write data/logs/omni.YYYY-MM-DD.utc.log (rolls over at 00:00 UTC)
keep_days = 0                  # daily log files to keep (0 = keep all)

[telegram]
# From https://my.telegram.org/apps
api_id = "${TELEGRAM_API_ID}"
api_hash = "${TELEGRAM_API_HASH}"

# Several bots can run in one process (separate rate limits, isolation).
# For each request, the first bot in this list that is a member of the chat and
# whose `models` patterns match the model handles it: put specific bots first,
# catch-alls last. Patterns match canonical ids like `openrouter:anthropic/claude-opus-5.5`.
[[bots]]
name = "main"                  # stable internal name (database key) — do not rename casually
token = "${TELEGRAM_BOT_TOKEN}"
models = ["*"]
default_model = "gpt"          # used by a bare `$text`
# chats = [-1001234567890]     # optional: restrict this bot to these chats

# Example: a dedicated Claude bot in the same groups.
# [[bots]]
# name = "claude"
# token = "${TELEGRAM_BOT_TOKEN_CLAUDE}"
# models = ["openrouter:anthropic/*"]
# default_model = "c"

[access]
admins = []                    # your Telegram user id(s); /whoami shows it
allowed_chats = []             # seeded into the ACL at start; manage at runtime with /allow, /deny
allowed_users = []             # private-chat users; manage with /allow_user
priority_users = []            # may request higher-priority (pricier) tiers: +tier=priority, fast modes.
                               # Nobody (admins included) gets them by default.

[providers.openrouter]
api_key = "${OPENROUTER_API_KEY}"
# base_url = "https://openrouter.ai/api/v1"
# Fidelity defaults (see docs/openrouter-fidelity.md). Per request: `+p=<slug>` / `+p=any`.
pin_first_party = true         # provider.only = [model creator's own endpoint], no fallbacks
require_parameters = true      # never let OpenRouter silently drop parameters
echo_upstream_body = true      # log the exact upstream request (also in /info)
max_tokens_cap = 393216        # cap for the automatic max_tokens (0 = model maximum)
# Gemini long decode: models answering past the per-request output limit in
# several continuation hops. Their max_tokens is a total budget across hops;
# replying /continue to an answer that hit it extends it by the same amount.
long_decode = ["google/gemini-4*"]
long_decode_budget = 393216
# Stable per-user hash sent as `user` (abuse attribution); leave empty to not send it.
user_id_salt = "${OPENROUTER_USER_SALT:-}"
# Official providers users may switch to with `+p=<slug>` (per model author;
# base slugs, regions included). Built-in defaults: openai = openai, azure,
# amazon-bedrock; anthropic = anthropic, amazon-bedrock, google-vertex, azure,
# claude-on-aws; google = google-ai-studio, google-vertex; x-ai = xai,
# amazon-bedrock; open-weight vendors only their own endpoint. Override e.g.:
# [providers.openrouter.allowed_providers]
# google = ["google-ai-studio", "google-vertex"]
# Override the author -> first-party provider mapping:
# [providers.openrouter.first_party]
# google = "google-vertex"

[render]
markdown = "clean"             # clean | raw (raw = the model's exact Markdown source)
min_edit_interval_secs = 3.0   # per bot and group chat (private chats: 1s)
first_flush_delay_secs = 1.0
max_messages_per_reply = 30
show_usage = "always"          # always | never | USD threshold such as "0.05"

[retry]
max_attempts = 4               # including the first; only retryable errors are retried
base_delay_secs = 10
max_delay_secs = 120

