# ------------------------------------------------------------------ presets
# Default options for matching models, in the same syntax as after a prefix
# (validated like the user's; the user's options override them). Requests
# otherwise default to the highest the model officially offers (reasoning
# effort, output length, reasoning summaries, image output).

# Image models: the largest image size by default.
[[presets]]
match = "openrouter:google/gemini-*image*"
note = "largest image size"
options = "4"

[[presets]]
match = "openrouter:google/gemini-nano-banana*"
note = "largest image size"
options = "4"

